[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "maxionbench"
version = "0.3.0.dev0"
description = "MaxionBench: reproducible LLM serving, routing, and evaluation harness"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
  "numpy>=1.26",
  "pandas>=2.2",
  "pyarrow>=15.0",
  "PyYAML>=6.0",
  "requests>=2.31",
]

[project.optional-dependencies]
dev = [
  "build>=1.2,<2",
  "pip-tools>=7.4,<8",
  "pytest>=8.0,<9",
  "ruff>=0.9,<1",
]
agents = [
  "bm25s>=0.2,<1",
  "mcp>=1.9,<2",
]

[tool.setuptools.packages.find]
include = ["maxionbench*"]

[tool.setuptools.package-data]
"maxionbench.datasets" = ["manifests/*.yaml"]
"maxionbench.graders" = ["calibration/*.jsonl"]

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = [
  ".git",
  ".pytest_cache",
  "artifacts",
  "dataset",
  "release",
  "results",
]

[tool.ruff]
target-version = "py311"
line-length = 120
extend-exclude = [
  "artifacts",
  "dataset",
  "release",
  "results",
]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
