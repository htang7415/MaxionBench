schema_version: maxionbench-experiment-v1
name: serving-routing
description: >
  Client-side routing policies over 3 CPU llama.cpp replicas at the v0.2 capacity point
  (0.5 req/s), multi-turn HotpotQA RAG sessions, 3 repeats per cell.
seed: 42
repeats: 3
seed_strategy: per_repeat
target:
  kind: llamacpp_replicas
  params:
    model: ~/models/qwen2.5-0.5b-instruct-q4_k_m.gguf
    replicas: 3
    threads: 3
    slots: 2
    ctx: 8192
    cache_ram_mib: 64
    base_port: 8100
    routing_policy: round_robin
workload:
  kind: rag_sessions
  params:
    dataset: dataset/processed/hotpot_portable
    sessions: 30
    turns: 3
    k: 5
    window: 8
    rate_rps: 0.5
    max_in_flight: 12
    timeout_s: 30
    max_tokens: 24
slo:
  ttft_s: 2.5
  e2e_s: 4.0
matrix:
  target.routing_policy: [round_robin, least_outstanding, prefix_affinity]
quiet_host:
  max_load_1m: 3.0
  wait_s: 60
