schema_version: maxionbench-experiment-v1
name: ci-smoke-llamacpp
description: >
  CI performance smoke: llama.cpp CPU-only with Qwen3-0.6B Q8_0 (thinking off), closed loop at
  concurrency 1 and 2 with fixed 32-token outputs. A floor on throughput and a ceiling on TTFT catch
  large regressions on shared CI runners without flaking on normal noise.
seed: 7
repeats: 2
reuse_targets: true
target:
  kind: llamacpp_replicas
  params:
    model: ~/models/Qwen3-0.6B-Q8_0.gguf
    device: cpu
    replicas: 1
    threads: 4
    slots: 2
    ctx: 4096
    cache_ram_mib: 0
    cache_prompt: false
    disable_thinking: true
    base_port: 8450
workload:
  kind: synthetic_chat
  params: {requests: 12, sessions: 12, prompt_words: 100, concurrency: 1, max_tokens: 32, ignore_eos: true,
           warmup_requests: 2, timeout_s: 120}
slo:
  ttft_s: 5.0
  e2e_s: 20.0
matrix:
  workload.concurrency: [1, 2]
quiet_host:
  max_load_1m: 1000
  wait_s: 0
