schema_version: maxionbench-kvlive-v1
name: k8-vllm-metal-copilot-context-policies
description: >
  K8 (v0.4 Step 4, real-engine check of K6): the K6 Copilot policy traces replayed live through llm-d EPP
  v0.11 + Envoy over 1 native vllm-metal replica of Qwen3-0.6B Q8 (Apple GPU, prefix caching on). Each
  64-token trace block is 2 token ids (prompts 1/32 of their size: median 1.9k tokens; max_model_len 12,288
  rejects the longest ~0.3%, counted as errors) so the
  workload fits a 16 GB machine shared with other work; 8 active sessions, trace time compressed 4x,
  outputs scaled to 5% (max 32 tokens). Server-side prefix-cache hit ratio and TTFT come from the real
  engine; the replica gets 30% of unified memory (vllm-metal reports a 1.67 GB KV budget, ~15k tokens,
  ~480k trace tokens for 8 sessions: K6's tight 512k per 8 sessions). A second replica does not fit
  next to it on this machine. TTFT and SLO are in compressed time. One repeat.
traces:
  full: copilot/policy_traces/full.sessions600.jsonl
  truncate: copilot/policy_traces/truncate.sessions600.jsonl
  window: copilot/policy_traces/window.sessions600.jsonl
  mask: copilot/policy_traces/mask.sessions600.jsonl
  summarize: copilot/policy_traces/summarize.sessions600.jsonl
  window+cache: copilot/policy_traces/window_cache.sessions600.jsonl
  mask+cache: copilot/policy_traces/mask_cache.sessions600.jsonl
idle_cap_s: 300
seed: 7
repeats: 1
replay: {concurrency: 8, horizon_s: 600, warmup_s: 120, time_scale: 4, tokens_per_block: 2, output_scale: 0.05,
         max_output_tokens: 32, ttft_slo_s: 1.0, timeout_s: 120}
target:
  workers: vllm_metal
  model: qwen3-0.6b
  worker_params:
    model: ~/models/Qwen3-0.6B-Q8_0.gguf
    tokenizer: Qwen/Qwen3-0.6B
    replicas: 1
    base_port: 8210
    max_model_len: 12288
    gpu_memory_utilization: 0.30
    max_num_seqs: 8
    enable_prefix_caching: true
cells:
  - {scorer_profile: optimized-baseline}
