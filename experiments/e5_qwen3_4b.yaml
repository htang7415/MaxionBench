schema_version: maxionbench-e5-v1
name: e5-qwen3-4b
description: >
  E5 local side (GPU window): Qwen3-4B Q8_0 on vllm-metal (Mac GPU), thinking disabled, hermes tool
  parser, on exactly the items of e5_gemini.yaml (same seed and sizes). Answers at concurrency 1; RAG
  correctness from the same Gemini judge (rubric qa-judge-v1). Local spend is $0; judge spend is not.
seed: 0
shards: 5
model:
  kind: vllm_metal
  params:
    model: ~/models/Qwen3-4B-Q8_0.gguf
    tokenizer: Qwen/Qwen3-4B
    max_model_len: 16384
    gpu_memory_utilization: 0.45
    max_num_seqs: 4
    enable_prefix_caching: true
    base_port: 8200
    extra_args: ["--enable-auto-tool-choice", "--tool-call-parser", "hermes"]
judge: {model: gemini-3.5-flash-lite, reasoning_effort: low}
suites:
  rag_crag: {n: 500}
  rag_hotpot: {n: 300}
  bfcl: {per_category: 100}
  agent: {n: 100, max_steps: 8}
